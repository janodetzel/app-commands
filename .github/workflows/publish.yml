name: Publish packages

# On every push to main, changesets/action does one of two things:
# - pending changesets: open or update the "Version Packages" pull request, which
#   bumps versions and writes changelogs;
# - no pending changesets (that pull request was just merged): publish every
#   package whose version is not on npmjs.org yet, then tag and release it.
#
# Publishing uses npm trusted publishing: npm exchanges the workflow's OIDC token
# for a short-lived publish token, so no npm token is stored anywhere, and it
# attaches a provenance attestation to every release. The package's settings on
# npmjs.com must name this repository and this workflow file as its trusted
# publisher; see "Releasing" in README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Lets the job mint the OIDC token npm trusted publishing exchanges.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      # Trusted publishing needs Node 22.14 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # ...and npm 11.5.1 or later: pnpm hands the upload to the npm on PATH, and
      # the npm that ships with Node may be older.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm depcruise

      # Pinned to v1: changesets/action v2 requires @changesets/cli v3, which needs pnpm 10.
      - uses: changesets/action@v1.9.0
        with:
          publish: pnpm changeset publish
          title: Version Packages
          commit: Version Packages
        env:
          # For the Version Packages pull request, the tag and the GitHub release.
          # Publishing authenticates through OIDC and needs no token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
